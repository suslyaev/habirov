<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фон -->
  <rect width="512" height="512" rx="100" fill="#007bff"/>
  
  <!-- Символ рубля/денег -->
  <g transform="translate(256, 256)">
    <!-- Круг с символом рубля -->
    <circle cx="0" cy="0" r="180" fill="#ffffff" opacity="0.15"/>
    
    <!-- Символ рубля -->
    <path d="M -80 -120 L -80 120 L -40 120 L -40 60 L 40 60 L 40 20 L -40 20 L -40 -20 L 40 -20 L 40 -60 L -40 -60 L -40 -120 Z" 
          fill="#ffffff" 
          stroke="#ffffff" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Дополнительные элементы - линии для обозначения учета -->
    <line x1="-120" y1="0" x2="-60" y2="0" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    <line x1="60" y1="0" x2="120" y2="0" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Маленькие точки для декора -->
    <circle cx="-140" cy="-40" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="-140" cy="40" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="140" cy="-40" r="8" fill="#ffffff" opacity="0.5"/>
    <circle cx="140" cy="40" r="8" fill="#ffffff" opacity="0.5"/>
  </g>
</svg>
